<style>

.st{border:1.5px solid var(--line);border-radius:14px;padding:14px;background:#fff;display:flex;flex-direction:column;gap:6px}

.layout{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}

.case{position:sticky;top:76px}@media(max-width:900px){.case{position:static}}
.scene{background:var(--amber-l);border:1px solid #ecc97a;border-radius:12px;padding:12px;font-size:.95rem;margin:8px 0}

.prompt{font-size:1.12rem;font-weight:700;margin:6px 0 12px}

.overlay.on{display:flex}.overlay .card{max-width:780px;width:100%;max-height:90vh;overflow:auto}
.code dl{margin:0}.code dt{font-weight:800;color:var(--accent);margin-top:10px}.code dd{margin:2px 0 0}
table.sum{width:100%;border-collapse:collapse;font-size:.93rem}

table.sum td{border-bottom:1px solid var(--line);padding:7px 6px;vertical-align:top}
.video-box{aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}.video-box video{width:100%;height:100%}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--deep);color:#fff;padding:10px 16px;border-radius:10px;z-index:60;display:none;max-width:92vw}
</style>

<script>
"use strict";
// ═════════ Contenido: estaciones, código y trabajo final
const CODE = [
  ["Art. 2", "Principios fundamentales: la vida, la salud, la libertad, la justicia, la igualdad, el bienestar, la integridad moral, física y psíquica, y la no discriminación."],
  ["Art. 3", "Valores: honor, lealtad, honestidad, respeto, responsabilidad, solidaridad, puntualidad, veracidad y educación."],

  ["Art. 5", "Deberes: actuar con dedicación y competencia; actualizarse; conocer las normas; no perjudicar al paciente; atender a todos sin discriminación (inc. f); reconocer errores; ayudar en emergencias; no encubrir el ejercicio deshonesto (inc. m)."],
  ["Art. 6", "Derechos: los de la Ley 28456 y su reglamento; ejercer con libertad y respeto a su criterio profesional; recibir trato digno."],
  ["Art. 7", "Funciones: asistencial, docente, de investigación, administración, consultoría, asesoría y otras según su formación."],
  ["Art. 8", "Acto profesional: participa en diagnóstico, pronóstico y tratamiento sin exceder el ámbito de sus competencias."],
  ["Arts. 9–11", "Infracciones y sanciones (amonestación, multa, suspensión hasta 2 años, expulsión). La sanción se individualiza según la gravedad, el daño, la reincidencia, la reparación espontánea, el autorreconocimiento y el cargo, entre otros."],
  ["Art. 12", "Ejercicio ilegal: practicar la profesión sin los requisitos legales del reglamento de la Ley 28456."],
  ["Art. 14", "Responsabilidad por daños causados por ejercicio negligente, imprudente o imperito."],
  ["Art. 16", "Para ejercer se requiere título profesional universitario, colegiatura y habilitación en el CTMP."],
  ["Art. 17", "Deber de certificación periódica y actualización permanente."],
  ["Art. 18", "Falta grave: proteger o apoyar con la propia firma o título a quien no cumple los requisitos para ejercer."],
  ["Art. 19", "Obligación de denunciar el ejercicio ilegal de la profesión y a quien lo permita."],
  ["Art. 20", "Respetar las normas de seguridad ocupacional, higiene, asepsia y antisepsia, y medio ambiente."],
  ["Art. 22", "Cumplir obligaciones y horario; abstenerse de alcohol, tabaco o estupefacientes en el trabajo y de actos contra la moral."],
  ["Art. 23", "Atención al paciente con calidad, calidez, comprensión y estricto respeto a su condición de ser humano."],
  ["Art. 24", "Secreto profesional: confidencialidad de la información del paciente, incluso después de la atención; divulgarla es falta."],
  ["Art. 25", "Informar riesgos y posibles reacciones adversas; consentimiento informado por escrito para pruebas de riesgo."],
  ["Art. 26", "Respeto recíproco y fraternidad entre colegas y equipos."],
  ["Art. 27", "Es falta difamar o insultar a colegas o directivos, también en redes sociales; los reclamos van por conducto regular y con pruebas."],
  ["Art. 28", "Solidaridad con los colegas que necesiten ayuda."],
  ["Art. 31", "Fomentar un buen clima laboral."],
  ["Art. 33", "Evitar juicios negativos que dañen la imagen de colegas o del equipo; tratar con respeto al personal a cargo."],
  ["Art. 34", "Atención preferencial al colega cuando corresponda, sin vulnerar los derechos de los pacientes."],
  ["Arts. 35–37", "Respetar a los directivos y las normas del CTMP, acatar sus resoluciones y presentar reclamos de manera alturada y por conducto regular."],
  ["Art. 39", "Para ser hábil y ejercer legalmente, pagar puntualmente las cuotas del CTMP."],
  ["Art. 41", "Lealtad al Colegio: discutir los problemas en su seno, sin comentarios que dañen su honorabilidad e imagen."],
  ["Art. 47", "El emblema del CTMP solo puede usarse con autorización; otras organizaciones únicamente en auspicios autorizados por resolución."],
  ["Art. 48", "Los directivos deben defender por igual las seis áreas de la Tecnología Médica."],
  ["Art. 61", "Falta grave: documentación falsa o recursos irregulares para obtener o revalidar un título."],
];
const ch = (t, ok, fb) => ({ t, ok: !!ok, fb });

function buildStations(rng) {
  const pick = (a) => a[Math.floor(rng() * a.length)];
  const colleague = pick(["Martín", "Diego", "Renzo", "Luis"]);
  const pac = pick(["Valeria", "Camila", "Fiorella", "Daniela"]);
  const pat = pick(["Andrés", "Joaquín", "Sebastián", "Bruno"]);
  const col2 = pick(["Rodrigo", "Gustavo", "Julio", "César"]);
  return [
    {
      id: "fund", icon: "⚖️", unit: "Unidad 1", title: "Antes del turno: fundamentos éticos", est: 12,
      scene: "Es tu primera semana como tecnólogo médico en el Hospital Santa Rosa (ficticio). Antes de iniciar el turno, la coordinadora reúne al equipo para repasar los fundamentos que guiarán cada decisión del día.",
      steps: [
        { type: "classify", check: "Distingue ética, moral y deontología", prompt: "Clasifica cada afirmación según corresponda a la <b>ética</b>, la <b>moral</b> o la <b>deontología</b>.",
          cats: ["Ética", "Moral", "Deontología"],
          items: [["En mi comunidad se considera una falta grave no saludar a los mayores.", 1, "Es una norma de costumbre de un grupo: moral."],
            ["Me pregunto, con argumentos, si es justo atender primero a quien paga más que a quien está más grave.", 0, "Es una reflexión crítica sobre lo correcto: ética."],
            ["El Código del CTMP obliga a guardar la confidencialidad incluso después de la atención.", 2, "Es un deber profesional codificado: deontología (art. 24)."],
            ["Mi familia me enseñó que mentir está mal.", 1, "Es una norma aprendida y vivida en el entorno: moral."],
            ["Analizo si debo respetar la decisión de un paciente que rechaza un examen, aunque yo piense distinto.", 0, "Es un razonamiento sobre el deber ser: ética."],
            ["Para ejercer se requiere título, colegiatura y habilitación.", 2, "Es un requisito del ejercicio profesional: deontología (art. 16)."]] },
        { type: "classify", check: "Aplica los principios de la bioética a situaciones reales", prompt: "¿Qué principio de la bioética orienta principalmente cada situación?",
          cats: ["Autonomía", "Beneficencia", "No maleficencia", "Justicia"],
          items: [["Solo hay un densitómetro y diez solicitudes: se prioriza con un criterio transparente según la necesidad clínica.", 3, "Distribuir recursos escasos con equidad: justicia."],
            ["Un paciente, ya informado, decide no continuar con la electroterapia y prefiere solo ejercicios.", 0, "Respetar la decisión informada de la persona: autonomía."],
            ["Antes de repetir una radiografía, el tecnólogo verifica si es imprescindible para no exponer al paciente sin necesidad.", 2, "Evitar un daño innecesario: no maleficencia."],
            ["La fisioterapeuta ajusta el programa para que el paciente recupere su independencia al caminar.", 1, "Buscar activamente el bien del paciente: beneficencia."]] },
        { type: "choice", check: "Reconoce la dignidad y la igualdad de derechos (DUDH y art. 2 del Código)", prompt: "Llega a triaje una mujer extranjera sin documento de identidad, con dolor intenso. Un compañero sugiere: «Que regrese cuando tenga DNI». ¿Qué haces?",
          opts: [ch("La atiendo con la misma diligencia que a cualquier paciente y gestiono su registro por los canales del establecimiento.", 1, "Correcto: la dignidad y los derechos son iguales para todas las personas (DUDH, art. 1). El Código protege la igualdad y la no discriminación (art. 2) y obliga a atender sin distinción por lugar de nacimiento (art. 5, inc. f) y a ayudar en urgencias (art. 5, inc. h)."),
            ch("Le pido que regrese con su documento: sin registro no puedo atenderla.", 0, "Una barrera administrativa no puede negar la atención a una persona con dolor intenso; vulnera la igualdad y la no discriminación."),
            ch("La atiendo al final, después de los pacientes peruanos.", 0, "Postergarla por su nacionalidad es discriminación (art. 5, inc. f).")] },
        { type: "multi", check: "Identifica los valores del ejercicio profesional (art. 3)", prompt: "Selecciona los valores que el art. 3 del Código reconoce para el ejercicio profesional.",
          items: [["Honor", 1], ["Veracidad", 1], ["Puntualidad", 1], ["Competitividad", 0], ["Solidaridad", 1], ["Popularidad", 0], ["Lealtad", 1], ["Obediencia sin cuestionar", 0], ["Educación", 1]],
          okfb: "Correcto. El art. 3 también incluye honestidad, respeto y responsabilidad." },
        { type: "write", check: "Reflexiona sobre la relación entre ética y deontología", min: 250, rows: 6,
          prompt: "Reflexión 1. ¿Por qué no basta con conocer el Código (deontología) y también se necesita la reflexión ética? Usa un ejemplo de tu especialidad.",
          tips: [[/[ée]tic/i, "Menciona explícitamente la ética."], [/c[óo]digo|deber|norma/i, "Relaciónala con el Código o los deberes profesionales."], [/ejemplo|por ejemplo|cuando|caso|paciente/i, "Incluye un ejemplo concreto de tu especialidad."]] },
      ],
    },
    {
      id: "chat", icon: "💬", unit: "Unidades 2 y 3", title: "Laboratorio: el chat del servicio", est: 15,
      scene: `21:40 h. En el grupo de WhatsApp del servicio, ${colleague} comparte la foto de un informe con un hallazgo poco frecuente. En la imagen se leen el nombre y el número de historia clínica de la paciente. Escribe: «¡Miren este caso! ¿Alguien la conoce? Vive por mi barrio 😅». Otro colega responde con una broma sobre el aspecto de la paciente.`,
      steps: [
        { type: "choice", check: "Actúa ante la vulneración del secreto profesional", prompt: "¿Qué haces primero?",
          opts: [ch("Pido que se elimine la imagen de inmediato y recuerdo en el grupo que la información de la paciente es confidencial.", 1, "Correcto: el secreto profesional obliga a todos (art. 24), y no actuar sería permitir la falta (art. 5, inc. m)."),
            ch("La reenvío a mis compañeros de estudio porque es un caso académico interesante.", 0, "Reenviarla multiplica la divulgación: también sería una falta al secreto profesional (art. 24)."),
            ch("No digo nada: no fui yo quien la publicó.", 0, "Callar permite que la falta continúe; el Código pide no encubrir ni permitir el ejercicio deshonesto (art. 5, inc. m).")] },
        { type: "multi", check: "Identifica las normas vulneradas", prompt: "¿Qué artículos del Código se vulneraron en el chat? Selecciona todos los que correspondan.",
          items: [["Art. 24 · Secreto profesional", 1], ["Art. 23 · Atención con respeto a la condición de ser humano (la broma)", 1], ["Art. 16 · Requisitos para ejercer", 0], ["Art. 39 · Pago de cuotas", 0], ["Art. 20 · Seguridad ocupacional", 0]],
          okfb: "Correcto: se divulgó información confidencial y se faltó el respeto a la dignidad de la paciente." },
        { type: "choice", check: "Usa la información clínica con fines académicos de forma ética", prompt: "El hallazgo sería útil para una sesión académica. ¿Cómo podría usarse?",

            ch("Con nombre, porque el fin es educativo.", 0, "El fin educativo no elimina el deber de confidencialidad."),
            ch("Solo si la paciente nunca se entera.", 0, "Que no se entere no lo vuelve ético: el deber existe igual.")] },
        { type: "choice", check: "Maneja los conflictos entre colegas por el conducto regular", prompt: `Al día siguiente, otro colega publica en Facebook que ${colleague} es «un incompetente y un chismoso». ¿Qué corresponde?`,
          opts: [ch("Recordar que los reclamos se presentan por el conducto regular y con pruebas; insultar en redes también es falta.", 1, "Correcto: el art. 27 sanciona la difamación o los insultos, incluso en redes sociales, y el art. 33 pide evitar juicios que dañen la imagen de un colega."),
            ch("Comentar y compartir la publicación: se lo merece.", 0, "Difundir el insulto también daña la reputación de un colega (arts. 27 y 33)."),
            ch("Crear otro grupo para criticarlo en privado.", 0, "Sigue siendo un daño a su imagen y no resuelve el problema por la vía correcta.")] },
        { type: "classify", check: "Analiza los factores de la sanción (art. 11)", prompt: "Si el caso llega al Comité de Ética, ¿qué factores del art. 11 atenuarían o agravarían la sanción?",
          cats: ["Atenúa", "Agrava"],
          items: [["Borró la foto y se disculpó con la paciente por iniciativa propia.", 0, "Reparación espontánea del daño."], ["Reconoció la falta desde el primer momento.", 0, "Autorreconocimiento de la falta."],
            ["Había hecho lo mismo el año anterior.", 1, "Reincidencia."], ["Era el jefe del servicio.", 1, "El cargo o la función que desempeña."], ["La imagen llegó a cientos de personas.", 1, "Gravedad del daño causado."]] },
        { type: "write", check: "Redacta una comunicación firme y respetuosa", min: 140, max: 700, rows: 5,
          prompt: "Escribe el mensaje que enviarías al grupo: firme, respetuoso y claro sobre lo que debe hacerse.",
          tips: [[/elimin|borr|retir/i, "Pide eliminar la imagen."], [/confiden|secreto|privac/i, "Menciona la confidencialidad o el secreto profesional."], [/por favor|gracias|equipo|colegas|compañer/i, "Usa un tono respetuoso hacia el equipo."]] },
      ],
    },
    {
      id: "rx", icon: "🩻", unit: "Unidad 2", title: "Radiología: información, consentimiento y deberes", est: 15,
      scene: `${pac}, de 27 años, llega para una tomografía de abdomen con contraste. En la ficha, la pregunta sobre embarazo está vacía. Cuando le preguntas, responde: «No sé, creo que no… ¿importa?». Tiene prisa y pide que empiecen ya.`,
